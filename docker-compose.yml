# ─────────────────────────────────────────────────────────────────────────
# FHIR Patient Manager — Docker Compose
#
# Start:        docker compose up --build -d
# Stop:         docker compose down
# Logs:         docker compose logs -f
# Status:       docker compose ps
#
# Secrets (FHIR_BASE_URL / FHIR_BEARER_TOKEN) are read from the local
# .env file and injected at runtime — they are never baked into the image.
# Copy .env.example to .env and fill it in before starting.
# ─────────────────────────────────────────────────────────────────────────

services:
  patient-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: fhir-patient-manager:latest
    container_name: fhir-patient-manager
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
